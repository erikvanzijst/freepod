name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

jobs:
  ui-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: |
          cd ui
          npm ci

      - name: Run UI tests (Vitest)
        run: |
          cd ui
          npm test

  # Validates products/catalog/ using the files alone — no database and no
  # cluster access — so a malformed catalog is caught in review rather than by
  # the catalog init container during a rollout.
  catalog-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint the product catalog
        run: |
          cd api
          uv sync
          uv run caelus catalog lint

  # Tests the client and proves its distribution installs. Defined in its own
  # workflow because `publish-cli.yml` runs the identical gate before it
  # uploads to PyPI — see the comment there.
  cli:
    permissions:
      contents: read
    uses: ./.github/workflows/cli-checks.yml

  # The dev-profile SSH sidecar, driven by docker and ssh with no cluster:
  # `docker run --pid=container:<name>` reproduces the shared process namespace
  # a pod provides. Every negative case in there is a security property rather
  # than a feature -- password authentication refused, unknown key refused,
  # unlisted forward destination refused, the requested command never expanded
  # by the dispatcher -- which is why it gates the branch rather than being run
  # by hand when someone remembers.
  ssh-sidecar-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run the ssh-sidecar harness
        run: ./products/_lib/ssh-sidecar-image/test/run-tests.sh

  # The SSH auth resolver's Go suite. The devcontainer's post-create.sh has
  # already created the test db and set CAELUS_TEST_DATABASE_URL and has run
  # `alembic upgrade head`.
  ssh-auth-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CAELUS_SND_DEVICE: /dev/null
      CAELUS_AUDIO_GROUP: root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and run the resolver tests in the dev container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}-devcontainer
          push: never
          runCmd: |
            cd ssh-auth
            go vet ./...
            go test ./...

  publish-images:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [ui-test, api-test, catalog-lint, cli, ssh-sidecar-test, ssh-auth-test]
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and publish images
        run: ./scripts/build-images.sh --all

      - name: Publish the SSH sidecar when its version is new
        run: ./scripts/build-images.sh --ssh-sidecar --skip-if-published

      - name: Publish the SSH auth resolver when its version is new
        run: ./scripts/build-images.sh --ssh-resolver --skip-if-published

  api-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The dev container passes through the host's audio device and group for
    # local speech-to-text. Runners are headless and have neither, and docker
    # fails to start a container whose device source is missing, so point both
    # at values that always exist here.
    env:
      CAELUS_SND_DEVICE: /dev/null
      CAELUS_AUDIO_GROUP: root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and run dev container tests
        uses: devcontainers/ci@v0.3
        with:
          # Image name for caching; not pushed
          imageName: ghcr.io/${{ github.repository }}-devcontainer
          push: never
          runCmd: |
            cd api
            uv sync
            uv run pytest -s
