services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=caelus
      - POSTGRES_PASSWORD=caelus
      - POSTGRES_DB=caelus
    ports:
      - "5432:5432"
    volumes:
      - ./var/pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caelus -d caelus"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    # Allow Chrome sandboxing:
    cap_add:
      - SYS_ADMIN
    group_add:
      # Local dev passes through the host's audio group and sound device for
      # speech-to-text. CI runners are headless and have neither, and docker
      # refuses to start a container whose device source is missing, so CI
      # overrides both to values that always exist (see .github/workflows/ci.yml).
      - ${CAELUS_AUDIO_GROUP:-audio}
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - ${CAELUS_SND_DEVICE:-/dev/snd}:/dev/snd
    shm_size: "1gb"
    ports:
      - "5173:5173" # ui
      - "8000:8000" # api
      - "8501:8501" # streamlit
    env_file:
      - path: ./.env
        required: false
    environment:
      - CAELUS_DATABASE_URL=postgresql+psycopg://caelus:caelus@postgres:5432/caelus
      - CAELUS_TEST_DATABASE_URL=postgresql+psycopg://caelus:caelus@postgres:5432/caelus_test
      - UPGRADER_TEST_DATABASE_URL=postgresql+psycopg://caelus:caelus@postgres:5432/upgrader_test
      - KUBECONFIG=/workspace/src/k8s/kubeconfigs/dev-k3s.yaml
      # https://github.com/anthropics/claude-code/issues/1736#issuecomment-3170502150
      - CLAUDE_CONFIG_DIR=/home/vscode/.claude
      - QWEN_STREAM_IDLE_TIMEOUT_MS=900000
      - QWEN_STREAM_MAX_LIFETIME_MS=3600000
    volumes:
      # Mount the checkout's parent so sibling dirs (trees/, apps/) are shared
      # with the host, then pin the checkout itself at /workspace/src. The
      # second mount is what makes workspaceFolder stable: without it the repo
      # would land at /workspace/<host dir name>, which is "src" locally but
      # "freepod" on a CI runner (/home/runner/work/freepod/freepod).
      - ..:/workspace
      - .:/workspace/src
    depends_on:
      postgres:
        condition: service_healthy
