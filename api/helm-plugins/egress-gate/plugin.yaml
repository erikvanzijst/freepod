# Injects the egress gate into every tenant release; see app/egress_gate.py.
# Found through HELM_PLUGINS, which the API image points at this directory's
# parent.
apiVersion: v1
type: postrenderer/v1
name: egress-gate
version: 0.1.0
runtime: subprocess
runtimeConfig:
  platformCommand:
    - command: python
      args: ["-m", "app.egress_gate"]
