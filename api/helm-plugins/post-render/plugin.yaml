# The platform's post-renderer for every tenant release; see app/post_render.py.
# Found through HELM_PLUGINS, which the API image points at this directory's
# parent.
apiVersion: v1
type: postrenderer/v1
name: post-render
version: 0.1.0
runtime: subprocess
runtimeConfig:
  platformCommand:
    - command: python
      args: ["-m", "app.post_render"]
