server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik proxies to us from an in-cluster pod IP, so $remote_addr would
    # otherwise log the proxy rather than the visitor. Trust the k3s pod CIDR
    # and recover the client from X-Forwarded-For; recursive mode walks the
    # header right-to-left and takes the first address outside that range.
    set_real_ip_from 10.42.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Traefik terminates TLS, so an absolute redirect built from our own
    # scheme and port would send visitors to http://. Keep Location relative.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    # Pages with their own link-preview tags get their own HTML, emitted by the
    # page-meta plugin in vite.config.ts. Crawlers don't run JavaScript.
    location ~ ^/dev/?$ {
        try_files /dev.html =404;
        add_header Cache-Control "no-store" always;
    }

    # Raw legal documents (/legal/privacy.md etc.), published by the build.
    # text/plain rather than text/markdown so browsers display them instead of
    # downloading them. No SPA fallback: an unknown slug is a real 404.
    location ~ ^/legal/[a-z]+\.md$ {
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Docusaurus site (ui/docs), built with trailingSlash: false, so a page is
    # either <path>.html or <path>/index.html. ^~ keeps the asset regex below
    # from claiming its files.
    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/ {
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /docs/404.html;
        add_header Cache-Control "no-cache" always;

        location ^~ /docs/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location ~ ^/blog(/.*)?$ {
        return 301 /docs/blog$1;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
