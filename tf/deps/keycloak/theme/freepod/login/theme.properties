# Freepod login theme — extends Keycloak's stock "keycloak.v2" PatternFly theme
# on top to match the freepod.eu landing page (see ui/src/components/landing/).
#
# We keep the parent's PatternFly base and restyle it through one extra
# stylesheet (css/login.css). The parent's own css/styles.css is re-listed first
# so its base rules load before our overrides. The one template we override is
# template.ftl, a copy of the parent's with the app-branded header added.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/login.css
