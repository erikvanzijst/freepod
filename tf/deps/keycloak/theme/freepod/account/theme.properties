# Freepod account-console theme. Extends Keycloak's keycloak.v3 account
# console (a PatternFly 5 React SPA) and brands it through the logo property and
# one stylesheet, which retunes PatternFly's dark theme to the Freepod palette.
#
# Freepod is dark-only. darkMode=true would only follow the OS preference, so it
# stays off and js/dark.js applies PatternFly's dark class unconditionally.
parent=keycloak.v3
darkMode=false

# Brand logo (upper-left) and where clicking it goes. Path is relative to the
# theme's resource URL; the file lives in resources/public/logo.svg.
logo=/public/logo.svg
logoUrl=https://freepod.eu

styles=css/account.css
scripts=js/dark.js
