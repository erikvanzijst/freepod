[project]
name = "upgrader"
version = "0.1.0"
description = "Runs the upgrade-product skill for every curated product, nightly, and keeps its history"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "boto3>=1.35",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upgrader"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
