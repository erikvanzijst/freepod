{{- /*
Two Secrets, because they are consumed by different containers and one of them
exists only when the platform does not supply the credential itself.

<release>-db carries the database credentials in both spellings: PHOTOPRISM_*
for the application and MARIADB_* for the database container, which seeds the
account from them on first initialization.

<release>-admin carries the first-start admin password, and is emitted **only**
for a standalone install. Under Caelus the tenant supplies it as the required
PHOTOPRISM_ADMIN_PASSWORD var, and this key would be a second, unused copy of a
credential that is deliberately write-only everywhere else.
*/}}
{{- $dbPassword := include "photoprism.dbSecretValue" (dict "root" . "key" "PHOTOPRISM_DATABASE_PASSWORD" "value" .Values.mariadb.auth.password) }}
{{- $rootPassword := include "photoprism.dbSecretValue" (dict "root" . "key" "MARIADB_ROOT_PASSWORD" "value" .Values.mariadb.auth.rootPassword) }}
{{- $platformSuppliesPassword := ne (.Values.caelus.vars.secretName | default "") "" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "photoprism.labels" . | nindent 4 }}
type: Opaque
stringData:
  PHOTOPRISM_DATABASE_NAME: {{ .Values.mariadb.auth.database | quote }}
  PHOTOPRISM_DATABASE_USER: {{ .Values.mariadb.auth.username | quote }}
  PHOTOPRISM_DATABASE_PASSWORD: {{ $dbPassword | quote }}
  MARIADB_DATABASE: {{ .Values.mariadb.auth.database | quote }}
  MARIADB_USER: {{ .Values.mariadb.auth.username | quote }}
  MARIADB_PASSWORD: {{ $dbPassword | quote }}
  MARIADB_ROOT_PASSWORD: {{ $rootPassword | quote }}
{{- if not $platformSuppliesPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "photoprism.labels" . | nindent 4 }}
type: Opaque
stringData:
  PHOTOPRISM_ADMIN_PASSWORD: {{ include "photoprism.adminPassword" . | quote }}
{{- end }}
