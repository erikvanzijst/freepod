{{- /*
Immich runtime config, referenced via IMMICH_CONFIG_FILE. Carries the external
URL (so generated links/emails are correct behind the TLS proxy), optional SMTP
and, with SSO on, the OAuth login. Rendered as JSON, which Immich's YAML loader
reads as is and the SSO init container can merge the client secret into. Immich
applies the file on every start and locks its settings in the admin screens.
*/}}
{{- include "immich.ssoRequired" . }}
{{- $config := dict "server" (dict "externalDomain" (printf "https://%s" .Values.host)) }}
{{- if .Values.smtp.host }}
{{- $_ := set $config "notifications" (dict "smtp" (dict
      "enabled" true
      "from" .Values.smtp.from
      "transport" (dict "host" .Values.smtp.host "port" (int .Values.smtp.port)))) }}
{{- end }}
{{- if .Values.sso.enabled }}
{{- $oidc := .Values.caelus.oidc }}
{{- $issuer := trimSuffix "/" $oidc.issuer }}
{{- /* clientSecret is merged in at pod start (server.yaml), never rendered. */}}
{{- $_ := set $config "oauth" (dict
      "enabled" true
      "issuerUrl" $issuer
      "clientId" $oidc.clientId
      "scope" "openid email profile"
      "signingAlgorithm" "RS256"
      "tokenEndpointAuthMethod" "client_secret_post"
      "autoRegister" false
      "autoLaunch" true
      "buttonText" "Sign in with Freepod"
      "mobileOverrideEnabled" false
      "endSessionEndpoint" (printf "%s/oidc/logout?client_id=%s&post_logout_redirect_uri=%s"
        $issuer (urlquery $oidc.clientId) (urlquery (printf "https://%s/" .Values.host)))) }}
{{- $_ = set $config "passwordLogin" (dict "enabled" false) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "immich.labels" . | nindent 4 }}
data:
  immich-config.yaml: |
    {{- toPrettyJson $config | nindent 4 }}
