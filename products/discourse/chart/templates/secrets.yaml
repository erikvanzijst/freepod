{{- /*
<release>-db carries the database credentials: POSTGRES_* and DB_* for
upstream's postgres image, which creates the superuser from the first and the
discourse role from the second on first initialization, and
DISCOURSE_DB_PASSWORD for Discourse. DISCOURSE_SECRET_KEY_BASE rides along
because it is consumed by the same container and has the same lifecycle.
Discourse accepts only 128 lowercase hex digits and silently swaps anything
else for a key it keeps in Redis.

<release>-admin exists only for a standalone install. Under Caelus the tenant
supplies DISCOURSE_ADMIN_PASSWORD as a required sensitive var, and this would
be a second, unused copy of a credential that is write-only everywhere else.
*/}}
{{- $superPassword := include "discourse.stableSecret" (dict "root" . "secret" "db" "key" "POSTGRES_PASSWORD") }}
{{- $dbPassword := include "discourse.stableSecret" (dict "root" . "secret" "db" "key" "DB_PASSWORD" "value" .Values.postgres.auth.password) }}
{{- $keyBase := include "discourse.stableSecret" (dict "root" . "secret" "db" "key" "DISCOURSE_SECRET_KEY_BASE" "value" (sha512sum (randAlphaNum 64))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_PASSWORD: {{ $superPassword | quote }}
  DB_USER: {{ .Values.postgres.auth.username | quote }}
  DB_PASSWORD: {{ $dbPassword | quote }}
  DISCOURSE_DB_PASSWORD: {{ $dbPassword | quote }}
  DISCOURSE_SECRET_KEY_BASE: {{ $keyBase | quote }}
{{- if not .Values.caelus.vars.secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
type: Opaque
stringData:
  DISCOURSE_ADMIN_PASSWORD: {{ include "discourse.stableSecret" (dict "root" . "secret" "admin" "key" "DISCOURSE_ADMIN_PASSWORD" "value" .Values.admin.password "length" 24) | quote }}
{{- end }}
