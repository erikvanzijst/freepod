{{- /*
Bundled PostgreSQL: upstream's own image, which is postgres with pgvector, the
discourse role and the extensions Discourse needs, and the major version the
standard install runs. It starts as root and drops to the postgres user
itself, so no security context is imposed on it. PGDATA is a versioned
subdirectory of /var/lib/postgresql.

A StatefulSet rather than a Deployment: a deleted or evicted pod is replaced
only once it is gone, so two servers never share the data directory. The
volume is the fixed-name claim below rather than a volumeClaimTemplate, so it
stays Helm-owned like `shared`.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.postgres.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
  {{- if .Values.postgres.persistence.storageClassName }}
  storageClassName: {{ .Values.postgres.persistence.storageClassName }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "discourse.componentSelector" (dict "root" . "name" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
    {{- include "discourse.componentSelector" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-postgres
  selector:
    matchLabels:
      {{- include "discourse.componentSelector" (dict "root" . "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "discourse.componentSelector" (dict "root" . "name" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "discourse.podPlacement" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-db
          # Over TCP: the image's first-boot init, which creates the discourse
          # role, runs a temporary server that listens on the socket only.
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$DB_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$DB_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$DB_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
