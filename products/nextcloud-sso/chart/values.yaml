# Bespoke Nextcloud chart values.

# Public hostname. Used as the ingress rule host, NEXTCLOUD_TRUSTED_DOMAINS, and
# the Host header on the health probes.
host: "nextcloud.local"

trustedProxies:
  - "10.42.0.0/16"

image:
  repository: docker.io/library/nextcloud
  # Tag defaults to the chart appVersion (an -apache variant is appended).
  tag: ""
  pullPolicy: IfNotPresent

# Admin bootstrap account (only consumed on first init). Blank password
# generates one into <release>-admin; a tenant-supplied NEXTCLOUD_ADMIN_PASSWORD
# var overrides it.
admin:
  username: admin
  password: ""

# Wrapper ingress. TLS injected per-deployment by the Caelus reconciler.
ingress:
  enabled: true
  className: traefik
  annotations: {}

# Cluster-internal SMTP relay. Leave host empty to disable mail.
smtp:
  host: "smtp.mailer.svc.cluster.local"
  port: 25
  fromAddress: "nextcloud@freepod.eu"
  domain: "freepod.eu"
  secure: ""
  authtype: ""
  username: ""
  password: ""

# Nextcloud data PVC (files + config + apps). caelus.plan.storageSize overrides.
storage:
  data:
    accessMode: ReadWriteOnce
    size: 100Gi
    storageClassName: ""

# Bundled PostgreSQL: a lean StatefulSet on the official postgres image (see
# templates/postgres.yaml).
postgresql:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: nextcloud
    # Empty = auto-generate a strong password on first install and reuse it from
    # the <release>-db Secret on upgrade (see nextcloud.stableSecret). Set a
    # literal value only to pin an explicit password.
    password: ""
    database: nextcloud
  persistence:
    accessMode: ReadWriteOnce
    size: 8Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 15m
      memory: 128Mi
    limits:
      memory: 4Gi

resources:
  requests:
    cpu: 15m
    memory: 256Mi
  limits:
    memory: 6Gi

# Sign in with Freepod (app-oidc-chart-contract). With `enabled` and
# `protocol: oidc`, Nextcloud signs in only through the platform's OpenID
# Provider (caelus.oidc) with its user_oidc app, the owner (caelus.owner) is
# provisioned as an administrator, and Nextcloud creates an account for whoever
# the provider admits, so SSO requires `access: listed`. Everything under `oidc`
# is read by the platform, not by this chart.
auth:
  enabled: false
  protocol: header
  access: anyone

# Plan- and TLS-related values are injected per-deployment by the Caelus reconciler
# (caelus.plan.*, caelus.ingress.tls). These defaults let the chart render standalone
# (helm template / lint / tests): plan is empty so the PVC falls back to storage sizes.
caelus:
  releaseId: ""
  plan: {}
  ingress:
    enabled: false
    tls: {}
  vars: {}
  # Injected only for an SSO-enabled deployment: issuer, clientId and the name
  # of the Secret holding OIDC_CLIENT_SECRET; the owner's email and subject.
  oidc: {}
  owner: {}

sshSidecarImage: ghcr.io/erikvanzijst/freepod/ssh-sidecar:0.5.2
