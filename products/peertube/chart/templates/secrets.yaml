{{- /*
<release>-peertube carries the credentials PeerTube and its database share.
POSTGRES_* seed upstream's postgres image on first initialization, as in
upstream's compose file, and PeerTube connects as that role.
PEERTUBE_SECRET signs sessions and federation and is generated once, as
upstream's `openssl rand -hex 32`.

<release>-admin exists only for a standalone install. Under Caelus the tenant
supplies PEERTUBE_ADMIN_PASSWORD as a required sensitive var.
*/}}
{{- $dbPassword := include "peertube.stableSecret" (dict "root" . "secret" "peertube" "key" "POSTGRES_PASSWORD" "value" .Values.postgres.auth.password) }}
{{- $secret := include "peertube.stableSecret" (dict "root" . "secret" "peertube" "key" "PEERTUBE_SECRET" "value" (sha256sum (randAlphaNum 64))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-peertube
  labels:
    {{- include "peertube.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_PASSWORD: {{ $dbPassword | quote }}
  PEERTUBE_DB_PASSWORD: {{ $dbPassword | quote }}
  PEERTUBE_SECRET: {{ $secret | quote }}
{{- if not .Values.caelus.vars.secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "peertube.labels" . | nindent 4 }}
type: Opaque
stringData:
  PEERTUBE_ADMIN_PASSWORD: {{ include "peertube.stableSecret" (dict "root" . "secret" "admin" "key" "PEERTUBE_ADMIN_PASSWORD" "value" .Values.admin.password "length" 24) | quote }}
{{- end }}
