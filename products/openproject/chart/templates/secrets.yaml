{{- /*
<release>-db carries the database credentials in both spellings: POSTGRES_* for
the server, which seeds the account from them on first initialization, and
DATABASE_URL for OpenProject. SECRET_KEY_BASE and the hocuspocus secret ride
along because they are consumed by the same containers and have the same
lifecycle.

<release>-admin exists only for a standalone install. Under Caelus the tenant
supplies OPENPROJECT_ADMIN_PASSWORD as a required sensitive var, and this would
be a second, unused copy of a credential that is write-only everywhere else.
*/}}
{{- $dbPassword := include "openproject.stableSecret" (dict "root" . "secret" "db" "key" "POSTGRES_PASSWORD" "value" .Values.postgres.auth.password) }}
{{- $secretKeyBase := include "openproject.stableSecret" (dict "root" . "secret" "db" "key" "SECRET_KEY_BASE" "length" 64) }}
{{- $hocuspocusSecret := include "openproject.stableSecret" (dict "root" . "secret" "db" "key" "OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__SECRET" "length" 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "openproject.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ $dbPassword | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?pool=20&encoding=unicode&reconnect=true" .Values.postgres.auth.username ($dbPassword | urlquery) .Release.Name .Values.postgres.auth.database | quote }}
  SECRET_KEY_BASE: {{ $secretKeyBase | quote }}
  OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__SECRET: {{ $hocuspocusSecret | quote }}
{{- if not .Values.caelus.vars.secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "openproject.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENPROJECT_ADMIN_PASSWORD: {{ include "openproject.stableSecret" (dict "root" . "secret" "admin" "key" "OPENPROJECT_ADMIN_PASSWORD" "value" .Values.admin.password) | quote }}
{{- end }}
