{{- /*
`selector` targets the docmost pod: the library's instance-only default would
also match the postgres and redis pods, which have no sshd.
*/}}
{{ include "ssh-sidecar.resources" (dict
     "root" .
     "selector" (dict
       "app.kubernetes.io/name" "docmost"
       "app.kubernetes.io/instance" .Release.Name)) }}
