{{- /*
<release>-db carries the database credentials in both spellings: POSTGRES_* for
the server, which seeds the account from them on first initialization, and
DATABASE_URL for Docmost. APP_SECRET rides along because it is consumed by the
same container and has the same lifecycle.

<release>-admin exists only for a standalone install. Under Caelus the tenant
supplies DOCMOST_ADMIN_PASSWORD as a required sensitive var, and this would be
a second, unused copy of a credential that is write-only everywhere else.
*/}}
{{- $dbPassword := include "docmost.stableSecret" (dict "root" . "secret" "db" "key" "POSTGRES_PASSWORD" "value" .Values.postgres.auth.password) }}
{{- $appSecret := include "docmost.stableSecret" (dict "root" . "secret" "db" "key" "APP_SECRET" "length" 64) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "docmost.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ $dbPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.auth.username ($dbPassword | urlquery) .Release.Name .Values.postgres.auth.database | quote }}
  APP_SECRET: {{ $appSecret | quote }}
{{- if not .Values.caelus.vars.secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "docmost.labels" . | nindent 4 }}
type: Opaque
stringData:
  DOCMOST_ADMIN_PASSWORD: {{ include "docmost.stableSecret" (dict "root" . "secret" "admin" "key" "DOCMOST_ADMIN_PASSWORD" "value" .Values.admin.password) | quote }}
{{- end }}
