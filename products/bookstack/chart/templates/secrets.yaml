{{- /*
<release>-db carries the database credentials in both spellings: DB_* for
BookStack and MYSQL_* for the server, which seeds the account from them on first
initialization. APP_KEY rides along because it is consumed by the same
container and has the same lifecycle.

<release>-admin exists only for a standalone install. Under Caelus the tenant
supplies BOOKSTACK_ADMIN_PASSWORD as a required sensitive var, and this would be
a second, unused copy of a credential that is write-only everywhere else.
*/}}
{{- $dbPassword := include "bookstack.stableSecret" (dict "root" . "secret" "db" "key" "DB_PASSWORD" "value" .Values.mysql.auth.password) }}
{{- $rootPassword := include "bookstack.stableSecret" (dict "root" . "secret" "db" "key" "MYSQL_ROOT_PASSWORD" "value" .Values.mysql.auth.rootPassword) }}
{{- $appKey := include "bookstack.stableSecret" (dict "root" . "secret" "db" "key" "APP_KEY" "appKey" true) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "bookstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_HOST: {{ printf "%s-mysql:3306" .Release.Name | quote }}
  DB_DATABASE: {{ .Values.mysql.auth.database | quote }}
  DB_USERNAME: {{ .Values.mysql.auth.username | quote }}
  DB_PASSWORD: {{ $dbPassword | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.auth.database | quote }}
  MYSQL_USER: {{ .Values.mysql.auth.username | quote }}
  MYSQL_PASSWORD: {{ $dbPassword | quote }}
  MYSQL_ROOT_PASSWORD: {{ $rootPassword | quote }}
  APP_KEY: {{ $appKey | quote }}
{{- if not .Values.caelus.vars.secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "bookstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  BOOKSTACK_ADMIN_PASSWORD: {{ include "bookstack.stableSecret" (dict "root" . "secret" "admin" "key" "BOOKSTACK_ADMIN_PASSWORD" "value" .Values.admin.password) | quote }}
{{- end }}
