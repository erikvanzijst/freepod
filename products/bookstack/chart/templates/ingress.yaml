{{- if .Values.ingress.enabled }}
{{- /*
Wrapper-owned ingress. When the Caelus reconciler injects a per-deployment TLS
cert (caelus.ingress.enabled and not a wildcard), add the cert-manager issuer
annotation and a tls block; otherwise render plain (wildcard TLS is terminated
upstream).
*/}}
{{- $tlsCustom := and .Values.caelus.ingress.enabled (not .Values.caelus.ingress.tls.wildcard) }}
{{- $annotations := merge (dict) (.Values.ingress.annotations | default dict) }}
{{- if $tlsCustom }}{{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.caelus.ingress.tls.issuer }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    {{- include "bookstack.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tlsCustom }}
  tls:
    - hosts:
        - {{ .Values.caelus.ingress.host | quote }}
      secretName: {{ .Values.caelus.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-bookstack
                port:
                  number: 8080
{{- end }}
