{{- /*
Lemmy backend: the API, the ActivityPub endpoints, and the federation send/receive
workers. Reads everything from /config/config.hjson, projected out of the shared
Secret (see secrets.yaml). The image already runs as its own unprivileged user.

The admin password never appears in Helm values. Lemmy has no environment
override for it -- crates/utils/src/settings/mod.rs parses config.hjson with
deser_hjson and honours only LEMMY_DATABASE_URL, LEMMY_CONFIG_LOCATION and
LEMMY_INITIALIZE_WITH_DEFAULT_SETTINGS -- so the value has to reach it inside
the file. The render-config init container bridges that gap: it reads the
password from the environment (the platform's per-release vars Secret) and
writes the finished config into an emptyDir that only this pod can see.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-lemmy
  labels:
    {{- include "lemmy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lemmy.componentSelector" (dict "root" . "name" "lemmy") | nindent 4 }}
  ports:
    - name: http
      port: 8536
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-lemmy
  labels:
    {{- include "lemmy.componentLabels" (dict "root" . "name" "lemmy") | nindent 4 }}
spec:
  replicas: 1
  # Lemmy's federation workers assume a single writer; never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lemmy.componentSelector" (dict "root" . "name" "lemmy") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the rendered config changes; a Secret mounted as a
        # volume does not alter the pod-template hash.
        checksum/config: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "lemmy.componentSelector" (dict "root" . "name" "lemmy") | nindent 8 }}
        {{- include "lemmy.podLabels" . | nindent 8 }}
    spec:
      initContainers:
        # Add setup.admin_password to the config at pod start.
        #
        # A structural merge, not a text substitution: node parses the JSON,
        # sets one key, and re-serialises. The password is escaped by
        # JSON.stringify, so a value containing quotes, backslashes, newlines
        # or non-ASCII cannot corrupt the document -- there is no hand-rolled
        # escaping anywhere on this path. (envsubst and friends are the
        # opposite: pure textual substitution, which would let a password
        # containing a double quote produce a config Lemmy cannot parse.)
        #
        # Reuses the frontend image because the release already pulls it and
        # its tag already moves in lockstep with the backend's; all this needs
        # is a JSON parser, which the Postgres image does not have.
        - name: render-config
          image: {{ .Values.ui.image.repository }}:{{ include "lemmy.uiImageTag" . }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          command:
            - node
            - -e
            - |
              const fs = require("fs");
              const pw = process.env.LEMMY_ADMIN_PASSWORD;
              if (!pw) {
                console.error("LEMMY_ADMIN_PASSWORD is unset or empty");
                process.exit(1);
              }
              const cfg = JSON.parse(fs.readFileSync("/config-src/config.json", "utf8"));
              cfg.setup.admin_password = pw;
              fs.writeFileSync("/config/config.hjson", JSON.stringify(cfg, null, 2));
          env:
            - name: LEMMY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.caelus.vars.secretName }}
                  # Tenant-supplied at deploy time. Encrypted at rest, write-only
                  # through the API, and absent from Helm values and their logs.
                  name: {{ .Values.caelus.vars.secretName }}
                  key: LEMMY_ADMIN_PASSWORD
                  {{- else }}
                  # Standalone install: fall back to the chart-generated password.
                  name: {{ .Release.Name }}-secrets
                  key: admin-password
                  {{- end }}
          volumeMounts:
            - { name: config-src, mountPath: /config-src, readOnly: true }
            - { name: config, mountPath: /config }
        # Lemmy exits rather than retries when the database is unreachable at
        # boot, which would crash-loop the pod through the whole Postgres
        # first-start (initdb + restart). Wait it out here instead.
        - name: wait-for-postgres
          image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "lemmy.postgresHost" . }} -U "$POSTGRES_USER"; do sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-secrets, key: POSTGRES_USER }
      containers:
        - name: lemmy
          image: {{ .Values.image.repository }}:{{ include "lemmy.imageTag" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8536
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.lemmy.rustLog | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          # Lemmy 0.19 has no dedicated health endpoint. /.well-known/nodeinfo is
          # the cheapest 200 it serves: the handler builds its response purely
          # from settings and touches neither Postgres nor pict-rs. That is what
          # we want here -- a probe that reports whether the HTTP server is up,
          # and does not take the instance out of rotation over a slow query.
          # Database loss is covered instead by Lemmy exiting, which the
          # restart policy and the init container above handle.
          livenessProbe:
            httpGet: { path: /.well-known/nodeinfo, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /.well-known/nodeinfo, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            # First boot runs the full schema migration, which is slow; allow
            # five minutes before the liveness probe starts counting.
            httpGet: { path: /.well-known/nodeinfo, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          {{- with .Values.lemmy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # The Helm-rendered config, read-only. Only this key is projected: the
        # Secret also holds Postgres and pict-rs credentials, which have no
        # business appearing as files in Lemmy's config directory.
        - name: config-src
          secret:
            secretName: {{ .Release.Name }}-secrets
            items:
              - key: config.json
                path: config.json
        # The assembled config. emptyDir, not a Secret: it is built at pod start
        # from a value that never passes through Helm, and it lives and dies
        # with the pod.
        - name: config
          emptyDir: {}
