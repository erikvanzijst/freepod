apiVersion: v2
name: lemmy
description: >-
  Self-contained Caelus-native chart for Lemmy: the nginx routing proxy, the
  Rust backend, the SSR frontend, pict-rs media storage, and a bundled
  PostgreSQL StatefulSet. No upstream chart dependency.
type: application
version: 0.5.4
appVersion: "0.19.20"
keywords:
  - lemmy
  - fediverse
  - activitypub
  - forum
maintainers:
  - name: Caelus Team

# Only dependency is Freepod's own SFTP library chart (renders no resources on
# its own; provides the sidecar + Pipe/Service/Secret helpers).
dependencies:
  - name: ssh-sidecar
    version: "0.5.0"
    repository: "file://../../_lib/ssh-sidecar-chart"
