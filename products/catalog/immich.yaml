# yaml-language-server: $schema=./catalog.schema.json
schema_version: 1
product:
  slug: immich
  name: Immich
  description: Sync your photo hosting safely to the cloud
  category: Photos
  replaces: Google Photos · iCloud Photos
  icon: icons/immich.png
upstream:
  source:
    type: github-release
    repo: immich-app/immich
  match: ^v(?P<version>\d+\.\d+\.\d+)$
  version_path: template.system_values.image.tag
template:
  chart_ref: oci://ghcr.io/erikvanzijst/freepod/charts/immich
  chart_version: 0.2.1
  system_values:
    image:
      tag: v3.1.0
    smtp:
      host: smtp.mailer.svc.cluster.local
      port: 25
      from: immich@freepod.eu
  values_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      host:
        title: Hostname
        type: string
        minLength: 1
        description: The domainname for your Immich instance
    required:
    - host
    additionalProperties: false
