# yaml-language-server: $schema=./catalog.schema.json
schema_version: 1
product:
  slug: nextcloud
  name: Nextcloud
  description: Your very own secure collaboration suite in the cloud
  category: Files & documents
  replaces: Google Drive · Dropbox
  icon: icons/nextcloud.png
upstream:
  source:
    type: docker-tag
    image: docker.io/library/nextcloud
  match: ^(?P<version>\d+\.\d+\.\d+)-apache$
  version_path: template.system_values.image.tag
template:
  chart_ref: oci://ghcr.io/erikvanzijst/freepod/charts/nextcloud
  chart_version: 0.2.2
  system_values:
    image:
      tag: 34.0.2-apache
    smtp:
      host: smtp.mailer.svc.cluster.local
      port: 25
      fromAddress: nextcloud
      domain: freepod.eu
    admin:
      username: admin
  values_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      host:
        title: Hostname
        type: string
        minLength: 1
        description: The hostname for your Nextcloud instance
    required:
    - host
    additionalProperties: false
