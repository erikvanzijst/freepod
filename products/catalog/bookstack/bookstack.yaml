# yaml-language-server: $schema=../catalog.schema.json
schema_version: 1
product:
  slug: bookstack
  name: BookStack
  tagline: A simple, organized wiki for your notes and documentation.
  description: |-
    BookStack organizes knowledge the way people think about it: shelves hold books, and books hold chapters and pages. Write in a clean visual editor or in Markdown, add images and diagrams, and find anything again with full-text search.

    On Freepod, BookStack runs as your own private instance, hosted in the EU. Decide exactly who can see and edit each shelf, book or page, and every edit is kept in the page’s revision history.

    Moving on later? Export any page or book as PDF, HTML, Markdown or plain text.
  category: Knowledge & wikis
  replaces: Confluence · SharePoint
  icon: icon.png
  license: MIT
  features:
  - icon: library
    title: Shelves, books & pages
    body: A clear structure that’s easy to browse and hard to get lost in.
  - icon: edit
    title: Visual or Markdown
    body: Write in a WYSIWYG editor or in Markdown, whichever you prefer.
  - icon: search
    title: Full-text search
    body: Search across everything, with filters for tags and dates.
  - icon: lock
    title: Permissions
    body: Roles and per-item permissions, down to a single page.
  - icon: history
    title: Revisions
    body: Every edit is saved; compare versions and restore an old one.
  - icon: diagram
    title: Diagrams
    body: Draw diagrams in a page with the integrated diagrams.net editor.
  links:
  - label: Website
    href: https://www.bookstackapp.com
    kind: website
  - label: Documentation
    href: https://www.bookstackapp.com/docs/
    kind: docs
  - label: Source code
    href: https://codeberg.org/bookstack/bookstack
    kind: source
  - label: Release notes
    href: https://codeberg.org/bookstack/bookstack/releases
    kind: releases
  screenshots:
  - file: screenshots/page-view.webp
    caption: Readable pages with navigation built in
    form: desktop
    credit:
      text: BookStack · MIT
      href: https://codeberg.org/bookstack/website
  - file: screenshots/page-edit.webp
    caption: A WYSIWYG editor, or Markdown if you prefer
    form: desktop
    credit:
      text: BookStack · MIT
      href: https://codeberg.org/bookstack/website
  - file: screenshots/books-view.webp
    caption: Shelves and books to organize everything
    form: desktop
    credit:
      text: BookStack · MIT
      href: https://codeberg.org/bookstack/website
  - file: screenshots/book-overview.webp
    caption: Chapters and pages in every book
    form: desktop
    credit:
      text: BookStack · MIT
      href: https://codeberg.org/bookstack/website
  - file: screenshots/search.webp
    caption: Search everything, with filters
    form: desktop
    credit:
      text: BookStack · MIT
      href: https://codeberg.org/bookstack/website
  - file: screenshots/image-manager.webp
    caption: All your images in one place
    form: desktop
    credit:
      text: BookStack · MIT
      href: https://codeberg.org/bookstack/website
upstream:
  source:
    type: docker-tag
    image: docker.io/solidnerd/bookstack
  # The image version mirrors BookStack's own (v26.05.5 -> 26.5.5). Rebuild
  # suffixes such as 26.3.4-1 and the moving 26.5 / latest tags are excluded.
  # A tag may carry a digest pin (26.9.2@sha256:...) when upstream rebuilds
  # it in place, so a moved tag reaches new deployments.
  match: ^(?P<version>\d+\.\d+\.\d+)(?:@sha256:[0-9a-f]{64})?$
  version_path: template.system_values.image.tag
template:
  chart_ref: oci://ghcr.io/erikvanzijst/freepod/charts/bookstack
  chart_version: 0.1.7
  system_values:
    image:
      tag: 26.9.2@sha256:6fb7869fa642900637429c10057fe89f6c256047aff1010242343686b200d1d5
    smtp:
      host: smtp.mailer.svc.cluster.local
      port: 25
      from: bookstack@freepod.eu
  values_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    properties:
      host:
        type: string
        title: Hostname
        minLength: 1
        maxLength: 253
        description: The address of your wiki, such as wiki-alice.freepod.app, or a domain of your own.
      admin:
        type: object
        additionalProperties: false
        properties:
          name:
            type: string
            title: Your name
            minLength: 2
            maxLength: 100
            pattern: ^[^\u0000-\u001f\u007f]+$
            description: How you appear to others in BookStack. You sign in with the email address of
              your Freepod account. You can change both later from your BookStack profile.
        required:
        - name
      BOOKSTACK_ADMIN_PASSWORD:
        type: string
        title: Password
        minLength: 8
        maxLength: 72
        pattern: ^[^\u0000-\u001f\u007f]+$
        x-caelus-target: runtime
        x-caelus-sensitive: true
        description: 'The password for your account, which owns the wiki and can invite others.
          Store it somewhere safe: it won''t be shown again. It is set on first start only; to
          change it later, use BookStack''s own profile page.'
    required:
    - host
    - admin
    - BOOKSTACK_ADMIN_PASSWORD
