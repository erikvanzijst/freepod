- version: "17.9.6"
  notes: |-
    Workflows and activity behave as expected again, with a security fix on top.

    - Editing a workflow's rules saves the changes
    - Increase or decrease a work package's activity again
    - Copying a project no longer blocks creating work packages in it
    - A security fix stops budget details leaking to users who cannot view budgets
- version: "17.9.4"
  notes: |-
    A maintenance release with a fix for boards.

    - Moving a card to another list no longer reloads the whole list twice
- version: "17.9.3"
  notes: |-
    A small maintenance release that also fixes a security issue in the PDF export.

    - Pasting an image into a description no longer leaves a broken link
- version: "17.9.2"
  notes: |-
    Create work packages straight from a document, filter the backlog, and get date alerts.

    - Turn selected text in a document into a linked work package
    - Filter the backlog by subject and other criteria
    - Date alerts for upcoming and overdue work
    - Enter planned work in hours, days, weeks or months
    - Includes security fixes
