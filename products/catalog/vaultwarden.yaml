# yaml-language-server: $schema=./catalog.schema.json
schema_version: 1
product:
  slug: vaultwarden
  name: Vaultwarden
  description: Password manager compatible with Bitwarden clients
  category: Passwords & passkeys
  replaces: 1Password · LastPass
  icon: icons/vaultwarden.png
upstream:
  source:
    type: docker-tag
    image: docker.io/vaultwarden/server
  match: ^(?P<version>\d+\.\d+\.\d+)$
  version_path: template.system_values.image.tag
template:
  chart_ref: oci://ghcr.io/erikvanzijst/freepod/charts/vaultwarden
  chart_version: 3.4.1
  system_values:
    image:
      tag: 1.37.1
    smtp:
      host: smtp.mailer.svc.cluster.local
      port: 25
      from: vaultwarden@freepod.eu
      enabled: true
      security: 'off'
  values_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    properties:
      host:
        type: string
        title: Hostname
        description: The fully qualified domain name used to access Vaultwarden (e.g. password.freepod.eu)
      signups:
        type: object
        additionalProperties: false
        properties:
          allowed:
            type: boolean
            title: Allow open registration
            description: 'Allow anyone who knows the address to create an account. Leave off unless you
              need it: your own account is created for you, and you can invite others from the web vault.'
            default: false
          verify:
            type: boolean
            title: Require email verification on signups
            description: New users must confirm their email address before they can log in.
            default: true
    required:
    - host
