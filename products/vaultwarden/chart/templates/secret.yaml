{{- /*
Admin console token. Always present: the postStart hook authenticates with it to
invite the owner, so the console cannot be switched off. It is never shown to the
user — see _helpers.tpl "vaultwarden.adminToken".

Held in a Secret rather than as an inline env value so it does not show up in
`kubectl get deployment -o yaml`.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
data:
  admin-token: {{ include "vaultwarden.adminToken" . | b64enc | quote }}
