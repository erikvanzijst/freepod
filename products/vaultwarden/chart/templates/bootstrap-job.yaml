{{- /*
Seeds the first account. A fresh vaultwarden has no users and creates none, and
signups are closed by default, so without this the instance would deploy
perfectly and be impossible to log into.

The Job invites caelus.owner.email through the admin API; vaultwarden emails the
owner a link where they choose their master password. This is why the admin
console is enabled with a token the user never sees — the console exists for this
Job, not for the tenant.

Runs on install *and* upgrade because the invite is idempotent (a repeat invite
returns 409 "User already exists"), which makes a failed first attempt self-heal
on the next reconcile rather than needing manual repair.

It talks to the ClusterIP Service, never the Ingress, so blocking /admin at the
edge would not affect it.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  # Kept briefly after success so the logs are still readable when debugging a
  # "no invitation arrived" report.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "vaultwarden.labels" . | nindent 8 }}
        {{- include "vaultwarden.podLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: invite
          image: "{{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: VW
              value: "http://{{ .Release.Name }}-vaultwarden:{{ .Values.service.httpPort }}"
            - name: OWNER_EMAIL
              value: {{ required "vaultwarden: caelus.owner.email is required to invite the first user" .Values.caelus.owner.email | quote }}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-admin, key: admin-token }
            - name: READY_TIMEOUT
              value: {{ .Values.bootstrap.readyTimeoutSeconds | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            - sh
            - -eu
            - -c
            - |
              # Wait for vaultwarden to serve. /alive is its own health endpoint
              # and, unlike /, does not depend on the web vault being enabled.
              waited=0
              until curl -sf -o /dev/null "$VW/alive"; do
                waited=$((waited + 2))
                if [ "$waited" -ge "$READY_TIMEOUT" ]; then
                  echo "vaultwarden did not become ready within ${READY_TIMEOUT}s"
                  exit 1
                fi
                sleep 1
              done

              # The admin API is cookie-authenticated: POST the plaintext token to
              # /admin to get a VW_ADMIN session. A bearer header does not work,
              # and the token stays plaintext here even if ADMIN_TOKEN is stored
              # Argon2-hashed, because the server verifies against the hash.
              curl -sf -o /dev/null -c /tmp/jar -X POST "$VW/admin" \
                --data-urlencode "token=$ADMIN_TOKEN"

              code=$(curl -s -o /tmp/body -w '%{http_code}' -b /tmp/jar \
                -X POST "$VW/admin/invite" \
                -H 'Content-Type: application/json' \
                -d "{\"email\":\"$OWNER_EMAIL\"}")

              case "$code" in
                2??) echo "invited $OWNER_EMAIL"; exit 0 ;;
                409) echo "$OWNER_EMAIL already invited or registered; nothing to do"; exit 0 ;;
              esac

              # A non-2xx can still mean the account was created and only the
              # notification email failed. In that case the owner can finish at
              # /#/register with this address, so treat it as a warning rather
              # than failing the release and blocking an otherwise healthy vault.
              if curl -sf -b /tmp/jar "$VW/admin/users" | grep -qF "$OWNER_EMAIL"; then
                echo "WARNING: invite returned $code but $OWNER_EMAIL exists;"
                echo "the invitation email likely failed to send. The owner can"
                echo "complete registration at $VW/#/register with that address."
                exit 0
              fi

              echo "invite failed with HTTP $code"
              cat /tmp/body
              exit 1
      volumes:
        # readOnlyRootFilesystem: curl needs somewhere for the cookie jar.
        - name: tmp
          emptyDir: {}
