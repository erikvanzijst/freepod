{{- /*
Vaultwarden app: Service + Deployment. Single container, sqlite on the data PVC.

Every setting lands as an inline env var rather than an envFrom ConfigMap, so any
change (DOMAIN included) alters the pod template and Helm rolls the pod on its
own — no checksum annotation needed except for the Secret, whose contents are
pulled in by reference.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vaultwarden
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vaultwarden.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vaultwarden
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
    {{- include "vaultwarden.selectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  # Single RWO data volume: never two app pods at once.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "vaultwarden.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # ADMIN_TOKEN arrives by secretKeyRef, which does not alter the pod
        # template; without this the pod would keep a stale token after a change.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "vaultwarden.selectorLabels" . | nindent 8 }}
        {{- include "vaultwarden.podLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # fsGroup owns the PVC files. It must equal the SFTP sidecar's uid (1000,
        # the ssh-sidecar default) or its logins authenticate but cannot read.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ROCKET_PORT
              value: "8080"
            - name: DOMAIN
              value: {{ include "vaultwarden.domain" . | quote }}
            # sqlite write-ahead logging; the app owns /data exclusively.
            - name: ENABLE_DB_WAL
              value: "true"
            - name: SIGNUPS_ALLOWED
              value: {{ .Values.signups.allowed | quote }}
            {{- if and .Values.signups.verify (not .Values.smtp.enabled) }}
            {{- fail "signups.verify requires smtp.enabled: without a mailer the confirmation email is never sent and no one can complete a signup" }}
            {{- end }}
            - name: SIGNUPS_VERIFY
              value: {{ .Values.signups.verify | quote }}
            # Hardwired on, not a knob: the postStart hook invites the owner, and
            # an invited user can only complete registration while this is true.
            # It is also how an owner adds family members from the web vault
            # (Organization -> Members -> Invite) now that /admin is off limits.
            - name: INVITATIONS_ALLOWED
              value: "true"
            {{- with .Values.signups.domainsWhitelist }}
            - name: SIGNUPS_DOMAINS_WHITELIST
              value: {{ join "," . | quote }}
            {{- end }}
            - name: WEB_VAULT_ENABLED
              value: {{ .Values.features.webVault | quote }}
            - name: SENDS_ALLOWED
              value: {{ .Values.features.sends | quote }}
            - name: EMERGENCY_ACCESS_ALLOWED
              value: {{ .Values.features.emergencyAccess | quote }}
            - name: PASSWORD_HINTS_ALLOWED
              value: {{ .Values.features.passwordHints | quote }}
            - name: SHOW_PASSWORD_HINT
              value: {{ .Values.features.showPasswordHint | quote }}
            - name: ORG_CREATION_USERS
              value: {{ .Values.features.orgCreationUsers | quote }}
            - name: EMAIL_CHANGE_ALLOWED
              value: {{ .Values.features.emailChangeAllowed | quote }}
            {{- with .Values.proxy.ipHeader }}
            - name: IP_HEADER
              value: {{ . | quote }}
            {{- end }}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-admin, key: admin-token }
            {{- if .Values.smtp.enabled }}
            - name: SMTP_HOST
              value: {{ required "smtp.host is required when smtp.enabled" .Values.smtp.host | quote }}
            - name: SMTP_FROM
              value: {{ required "smtp.from is required when smtp.enabled" .Values.smtp.from | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_SECURITY
              value: {{ .Values.smtp.security | quote }}
            {{- with .Values.smtp.fromName }}
            - name: SMTP_FROM_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.log.level }}
            - name: EXTENDED_LOGGING
              value: "true"
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            - name: OWNER_EMAIL
              value: {{ required "vaultwarden: caelus.owner.email is required to invite the first user" .Values.caelus.owner.email | quote }}
            - name: READY_TIMEOUT
              value: {{ .Values.bootstrap.readyTimeoutSeconds | quote }}
            {{- range $key, $val := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          # Seeds the first account. A fresh vaultwarden has no users and creates
          # none, and signups are closed by default, so without this the instance
          # would deploy perfectly and be impossible to log into. It invites
          # OWNER_EMAIL through the admin API; vaultwarden emails the owner a link
          # where they choose their master password. This is why the admin console
          # is enabled with a token the user never sees.
          #
          # Runs on every container start because the invite is idempotent (a
          # repeat answers 409). Probes wait for the hook, and a failing hook
          # restarts the container, which retries it; on install or upgrade a
          # persistent failure keeps the pod un-Ready and the release rolls back.
          # A postStart hook's own output is discarded, so the script writes to
          # the main process's stdout to reach the container log.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -eu
                  - -c
                  - |
                    exec >>/proc/1/fd/1 2>&1
                    VW=http://127.0.0.1:8080
                    # /alive does not depend on the web vault being enabled.
                    waited=0
                    until curl -sf -o /dev/null "$VW/alive"; do
                      if [ "$waited" -ge "$READY_TIMEOUT" ]; then
                        echo "bootstrap: vaultwarden did not become ready within ${READY_TIMEOUT}s"
                        exit 1
                      fi
                      sleep 1
                      waited=$((waited + 1))
                    done

                    # The admin API is cookie-authenticated: POST the plaintext
                    # token to /admin for a VW_ADMIN session. A bearer header
                    # does not work.
                    tmp=$(mktemp -d)
                    trap 'rm -rf "$tmp"' EXIT
                    if ! curl -sf -o /dev/null -c "$tmp/jar" -X POST "$VW/admin" \
                      --data-urlencode "token=$ADMIN_TOKEN"; then
                      echo "bootstrap: admin login failed; cannot invite $OWNER_EMAIL"
                      exit 1
                    fi

                    code=$(curl -s -o "$tmp/body" -w '%{http_code}' -b "$tmp/jar" \
                      -X POST "$VW/admin/invite" \
                      -H 'Content-Type: application/json' \
                      -d "{\"email\":\"$OWNER_EMAIL\"}")

                    case "$code" in
                      2??) echo "bootstrap: invited $OWNER_EMAIL"; exit 0 ;;
                      409) echo "bootstrap: $OWNER_EMAIL already invited or registered; nothing to do"; exit 0 ;;
                    esac

                    # A non-2xx can still mean the account was created and only
                    # the notification email failed. The owner can then finish at
                    # /#/register with this address, so warn rather than fail.
                    if curl -sf -b "$tmp/jar" "$VW/admin/users" | grep -qF "$OWNER_EMAIL"; then
                      echo "bootstrap: WARNING: invite returned $code but $OWNER_EMAIL exists;"
                      echo "the invitation email likely failed to send. The owner can"
                      echo "complete registration at $DOMAIN/#/register with that address."
                      exit 0
                    fi

                    echo "bootstrap: invite failed with HTTP $code"
                    cat "$tmp/body"
                    exit 1
          # Vaultwarden also serves a lighter /alive; switching is a candidate
          # once it has been confirmed against a running instance.
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- include "ssh-sidecar.sidecar" (dict "root" . "image" .Values.sshSidecarImage
             "sessionRoot" "volume:/data"
             "mounts" (list (dict "volume" "data" "path" "/data"))) | nindent 8 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
