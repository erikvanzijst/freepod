# The `chrome` sidecar: App Studio's own pages under /.appstudio/, beside
# opencode. Everything it knows comes from the URL the ingress redirects to.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 64;
}

http {
  access_log off;
  server_tokens off;
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen {{ .Values.chromePort }};

    location /.appstudio/ {
      alias /etc/appstudio/chrome/;
      index index.html;
      add_header Cache-Control "no-cache" always;
    }

    # Whether the agent's app answers on the preview port, which the browser
    # cannot learn from the preview host: the app's own response if it does,
    # 204 if nothing listens (so an idle studio logs no errors).
    location = /.appstudio/probe {
      proxy_pass http://127.0.0.1:{{ .Values.preview.port }}/;
      proxy_method HEAD;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
      proxy_intercept_errors on;
      error_page 502 504 = @nothing-running;
      # Nothing listening is the normal idle state, not an error to log.
      error_log stderr crit;
      add_header Cache-Control "no-store" always;
    }

    location @nothing-running {
      add_header Cache-Control "no-store" always;
      return 204;
    }
  }
}
