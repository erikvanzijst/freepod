<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Studio</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --fg: #171717;
    --muted: color-mix(in srgb, var(--fg) 55%, transparent);
    --rule: color-mix(in srgb, var(--fg) 9%, transparent);
    --hover: color-mix(in srgb, var(--fg) 6%, transparent);
    --live: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0a0a0a; --fg: #ededed; --live: #22c55e; }
  }
  :root[data-theme="dark"] { --bg: #0a0a0a; --fg: #ededed; --live: #22c55e; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    flex: none; height: 40px; padding: 0 8px 0 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border-bottom: 1px solid var(--rule);
  }
  .home {
    display: flex; align-items: center; gap: 8px; min-width: 0;
    color: inherit; text-decoration: none; border-radius: 6px; padding: 4px 6px; margin-left: -6px;
  }
  .home:hover { background: var(--hover); }
  .home svg { flex: none; width: 18px; height: 18px; }
  .home .platform { color: var(--muted); }
  .home .sep { color: var(--rule); }
  .home .product { font-weight: 600; white-space: nowrap; }

  .actions { display: flex; align-items: center; gap: 8px; }
  .preview, .new-project { position: relative; }
  header button, .docs {
    display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px;
    font: inherit; color: inherit; background: transparent; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 7px;
  }
  header button:hover:not(:disabled), .docs:hover { background: var(--hover); }
  .docs { text-decoration: none; }
  .actions > *, header button { flex: none; white-space: nowrap; }
  @media (max-width: 560px) {
    .docs span, .new-project > button span { display: none; }
  }
  .docs svg { width: 13px; height: 13px; }
  .docs[hidden] { display: none; }
  header button:disabled { color: var(--muted); cursor: default; }
  .new-project > button svg { width: 13px; height: 13px; }
  .preview .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .6; }
  .preview.live .dot { background: var(--live); opacity: 1; }
  .preview svg { width: 13px; height: 13px; }
  .preview:not(.live) svg { display: none; }

  .nudge, .create {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 1; width: max-content; max-width: 260px;
    padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px;
    background: var(--bg); box-shadow: 0 6px 24px rgb(0 0 0 / .12);
    display: none;
  }
  .nudge.show, .create.show { display: block; }
  .nudge { cursor: pointer; }
  .nudge strong, .create label { display: block; margin-bottom: 2px; font-weight: 600; }
  .nudge span, .create p { color: var(--muted); }
  .create { width: 260px; z-index: 2; }
  .create p { margin: 0 0 8px; }
  .create .row { display: flex; gap: 6px; }
  .create input {
    flex: 1; min-width: 0; height: 28px; padding: 0 8px;
    font: inherit; color: inherit; background: transparent;
    border: 1px solid var(--rule); border-radius: 7px;
  }
  .create input:focus { outline: 2px solid color-mix(in srgb, var(--fg) 25%, transparent); outline-offset: -1px; }
  .create .error { margin: 8px 0 0; color: #dc2626; }
  .create .error:empty { display: none; }
  .nudge::before, .create::before {
    content: ""; position: absolute; top: -5px; right: 18px; width: 8px; height: 8px;
    background: var(--bg); border-left: 1px solid var(--rule); border-top: 1px solid var(--rule);
    transform: rotate(45deg);
  }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--bg); }
</style>
</head>
<body>
<header>
  <a class="home" id="home" href="/" title="Back to Freepod">
    <svg viewBox="96 78 320 364" aria-hidden="true">
      <path fill="currentColor" fill-rule="evenodd" d="M256 82C168 82 100 150 100 232C100 335 256 438 256 438S412 335 412 232C412 150 344 82 256 82ZM256 159L265 206L312 215L265 224L256 271L247 224L200 215L247 206Z"/>
    </svg>
    <span class="platform">Freepod</span><span class="sep">/</span><span class="product">App Studio</span>
  </a>
  <div class="actions">
  <a class="docs" id="docs" target="_blank" rel="noopener" title="How App Studio works" aria-label="Docs" hidden>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h4a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 0-1.5-1.5h-4zM13.5 3.5h-4A1.5 1.5 0 0 0 8 5v8a1.5 1.5 0 0 1 1.5-1.5h4z"/></svg>
    <span>Docs</span>
  </a>
  <div class="new-project">
    <button type="button" id="new-project" title="Start another app, in a project of its own" aria-label="New project">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
      <span>New project</span>
    </button>
    <form class="create" id="create" autocomplete="off" novalidate>
      <label for="project-name">New project</label>
      <p>A folder of its own for another app.</p>
      <div class="row">
        <input id="project-name" name="name" maxlength="40" placeholder="recipes" spellcheck="false" autocapitalize="off">
        <button type="submit" id="create-button">Create</button>
      </div>
      <p class="error" id="create-error" role="alert"></p>
    </form>
  </div>
  <div class="preview" id="preview" hidden>
    <button type="button" id="open" disabled title="Your app's live preview appears here once the agent runs it">
      <span class="dot"></span><span id="label">Preview</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h4v4M13 3 7.5 8.5M12 9.5V13H3V4h3.5"/></svg>
    </button>
    <div class="nudge" id="nudge" role="status">
      <strong>Your app is running</strong>
      <span>Open the preview to see it as you build.</span>
    </div>
  </div>
  </div>
</header>
<iframe id="studio" title="opencode" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script id="config" type="application/json">{{ include "appstudio.chromeConfig" . }}</script>
<script>
  // The page around opencode: a way back to Freepod, and a Preview button that
  // comes alive once the agent's app answers on the preview port (`probe`, a
  // proxy to it in this pod that says 204 while nothing listens). Its settings
  // are rendered in by the chart (#config), never read from the URL, which
  // anyone can craft. opencode runs in the iframe on this same origin; its
  // location is mirrored into this page's fragment, so a reload returns to the
  // same place, and only a path on this origin is ever restored from it.
  //
  // opencode keeps its project list in this browser's storage and reads it only
  // when it starts; a write while it runs is lost at its next save. So before
  // opencode loads, and again after New project with the iframe emptied first,
  // every app in the apps directory is added to that list (from opencode's own
  // file API), and Home is pointed at a new project.
  //
  // First visit in a browser (no projects yet): a new session in the first app
  // opens with an example prompt typed in, as a draft tab added here. The
  // storage keys and shapes are opencode 2.1's.
  const EXAMPLE_PROMPT = "Build and deploy a link shortener";
  const SERVER_KEY = "opencode.global.dat:server";
  const TABS_KEY = "opencode.window.browser.dat:tabs";
  const LAYOUT_KEY = "opencode.global.dat:layout";
  const config = JSON.parse(document.getElementById("config").textContent);
  const httpsUrl = (value) => {
    try { const url = new URL(value); return url.protocol === "https:" ? url.href : null; } catch { return null; }
  };

  // The opencode location a reload restores: a path on this origin outside the
  // chrome's own, or nothing.
  function restoredPath() {
    if (!location.hash.startsWith("#/")) return "";
    try {
      const url = new URL(location.hash.slice(1), location.origin);
      if (url.origin !== location.origin || url.pathname.startsWith("/.appstudio")) return "";
      return url.pathname + url.search + url.hash;
    } catch { return ""; }
  }

  const frame = document.getElementById("studio");

  const readJson = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
  };

  // The apps' directories, or null when they cannot be listed.
  async function listApps() {
    try {
      const query = new URLSearchParams({ "location[directory]": config.apps, path: "." });
      const res = await fetch(`/api/fs/list?${query}`, { cache: "no-store" });
      if (!res.ok) return null;
      return (await res.json()).data
        .map((entry) => ({ ...entry, name: entry.path.replace(/\/$/, "") }))
        .filter((entry) => entry.type === "directory" && !entry.name.startsWith("."))
        .map((entry) => `${config.apps}/${entry.name}`);
    } catch { return null; }
  }

  // Adds the apps opencode's project list lacks; true on a browser's first visit.
  function registerApps(apps, select) {
    let first = false;
    try {
      const store = readJson(SERVER_KEY, {});
      store.list ??= [];
      store.projects ??= {};
      store.lastProject ??= {};
      store.recentlyClosed ??= {};
      const local = (store.projects.local ??= []);
      first = local.length === 0;
      for (const app of [config.firstApp, ...(apps || [])]) {
        if (!local.some((p) => p.worktree === app)) local.push({ worktree: app, expanded: true });
      }
      store.lastProject.local ||= config.firstApp;
      localStorage.setItem(SERVER_KEY, JSON.stringify(store));
      if (select) {
        const layout = readJson(LAYOUT_KEY, {});
        layout.home = { ...layout.home, selection: { ...layout.home?.selection, directory: select } };
        localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout));
      }
    } catch {}
    return first;
  }

  function firstSession() {
    try {
      const tabs = readJson(TABS_KEY, []);
      const draftID = Array.from(crypto.getRandomValues(new Uint8Array(7)),
        (b) => b.toString(16).padStart(2, "0")).join("");
      tabs.push({ type: "draft", draftID, server: location.origin, directory: config.firstApp });
      localStorage.setItem(TABS_KEY, JSON.stringify(tabs));
      return `/new-session?${new URLSearchParams({ draftId: draftID, prompt: EXAMPLE_PROMPT })}`;
    } catch {}
    return "/?home";
  }

  const navigate = (path) => new Promise((resolve) => {
    frame.addEventListener("load", resolve, { once: true });
    frame.src = path;
  });

  async function start() {
    const first = registerApps(await listApps());
    frame.src = restoredPath() || (first ? firstSession() : "/?home");

    // Mirror opencode's location and title, and its colors, which follow its theme.
    let last = "";
    const mirror = () => {
      let doc;
      try { doc = frame.contentDocument; } catch { return; }
      if (!doc || !doc.body) return;
      const loc = frame.contentWindow.location;
      if (loc.protocol === "about:") return;
      const here = loc.pathname + loc.search + loc.hash;
      if (here !== last && loc.origin === location.origin) {
        last = here;
        history.replaceState(null, "", `${location.pathname}${location.search}#${here}`);
      }
      if (doc.title) document.title = `${doc.title} · App Studio`;
      const html = getComputedStyle(doc.documentElement);
      const body = getComputedStyle(doc.body);
      const bg = [html.backgroundColor, body.backgroundColor].find((c) => c && !/rgba\(0, 0, 0, 0\)|transparent/.test(c));
      if (bg) document.documentElement.style.setProperty("--bg", bg);
      if (body.color) document.documentElement.style.setProperty("--fg", body.color);
    };
    frame.addEventListener("load", mirror);
    setInterval(mirror, 500);

    poll();
  }

  // --- Freepod home and the preview ------------------------------------------

  const preview = document.getElementById("preview");
  const open = document.getElementById("open");
  const nudge = document.getElementById("nudge");
  const previewUrl = httpsUrl(config.preview);
  let live = null, signedIn = false, win = null;

  const platformUrl = httpsUrl(config.platform);
  if (platformUrl) {
    document.getElementById("home").href = platformUrl;
    const docs = document.getElementById("docs");
    docs.href = new URL("/docs/apps/products/appstudio", platformUrl).href;
    docs.hidden = false;
  }
  preview.hidden = !previewUrl;

  const seenKey = "appstudio.previewOpened";
  const seen = () => { try { return localStorage.getItem(seenKey) === "1"; } catch { return false; } };

  async function poll() {
    if (!previewUrl) return;
    try {
      const res = await fetch("/.appstudio/probe", { method: "HEAD", cache: "no-store", redirect: "manual" });
      if (res.status === 401 || res.type === "opaqueredirect") {
        // The studio's session ended: sign in again as a navigation of this
        // page, since the sign-in pages cannot run inside the iframe.
        if (signedIn) { location.reload(); return; }
      } else {
        signedIn = true;
        update(res.status !== 204);
      }
    } catch {}
    setTimeout(poll, 3000);
  }

  function update(now) {
    if (now === live) return;
    const becameLive = live === false && now;
    live = now;
    preview.classList.toggle("live", live);
    open.disabled = !live;
    open.title = live ? "Open your app's live preview" : "Your app's live preview appears here once the agent runs it";
    nudge.classList.toggle("show", live && (becameLive || !seen()) && !form.classList.contains("show"));
    if (!live) nudge.classList.remove("show");
  }

  open.addEventListener("click", () => {
    if (!previewUrl) return;
    nudge.classList.remove("show");
    try { localStorage.setItem(seenKey, "1"); } catch {}
    if (win && !win.closed) { win.focus(); return; }
    const width = Math.round(Math.min(1280, screen.availWidth * 0.5));
    const height = Math.round(screen.availHeight * 0.85);
    const left = Math.round(screen.availWidth - width - 24);
    win = window.open(previewUrl, "appstudio-preview", `popup,width=${width},height=${height},left=${left},top=48`);
    if (!win) window.open(previewUrl, "_blank");
  });
  nudge.addEventListener("click", () => open.click());

  // --- New project ---------------------------------------------------------
  //
  // The app's repository is made by `appstudio-new-app` in the opencode
  // container, run through opencode's terminal API. That call returns before
  // the command ends and keeps none of its output, so the name is checked here
  // first and the app counts as created once the listing shows it (the script
  // renames a finished repository into place). Then opencode reloads on its
  // Home with the new project selected.

  const NAME = /^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/;
  const newProject = document.getElementById("new-project");
  const form = document.getElementById("create");
  const nameInput = document.getElementById("project-name");
  const createButton = document.getElementById("create-button");
  const createError = document.getElementById("create-error");

  function showForm(show) {
    form.classList.toggle("show", show);
    if (show) { nudge.classList.remove("show"); createError.textContent = ""; nameInput.focus(); nameInput.select(); }
  }
  newProject.addEventListener("click", () => showForm(!form.classList.contains("show")));
  form.addEventListener("keydown", (e) => { if (e.key === "Escape") { showForm(false); newProject.focus(); } });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".new-project") && !createButton.disabled) showForm(false);
  });
  nameInput.addEventListener("input", () => { createError.textContent = ""; });

  async function createProject(name) {
    const before = await listApps();
    if (!before) throw new Error("Could not reach the studio. Try again.");
    const dir = `${config.apps}/${name}`;
    if (before.includes(dir)) throw new Error(`There is already a project called "${name}".`);
    const query = new URLSearchParams({ "location[directory]": config.firstApp });
    const res = await fetch(`/api/pty?${query}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ command: "appstudio-new-app", args: [name], cwd: config.apps, title: "New project" }),
    });
    if (!res.ok) throw new Error("Could not create the project. Try again.");
    const pty = (await res.json()).data.id;
    for (let tries = 0; tries < 34; tries++) {
      await new Promise((resolve) => setTimeout(resolve, 300));
      const apps = await listApps();
      if (apps && apps.includes(dir)) {
        // opencode keeps an exited terminal listed until it is removed.
        fetch(`/api/pty/${encodeURIComponent(pty)}?${query}`, { method: "DELETE" }).catch(() => {});
        return apps;
      }
    }
    throw new Error("The project did not appear. Try again.");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim().toLowerCase();
    if (!NAME.test(name)) {
      createError.textContent = "Use 3 to 40 letters, digits and hyphens, not starting or ending with a hyphen.";
      return;
    }
    createButton.disabled = nameInput.disabled = true;
    createButton.textContent = "Creating…";
    try {
      const apps = await createProject(name);
      // Empty the iframe first, so opencode cannot overwrite what is written next.
      await navigate("about:blank");
      registerApps(apps, `${config.apps}/${name}`);
      nameInput.value = "";
      showForm(false);
      await navigate("/?home");
    } catch (err) {
      createError.textContent = err.message;
    } finally {
      createButton.disabled = nameInput.disabled = false;
      createButton.textContent = "Create";
      if (form.classList.contains("show")) nameInput.focus();
    }
  });

  if (window.top !== window) {
    // Something inside opencode loaded `/` in the iframe: be opencode there.
    location.replace("/?home");
  } else {
    start();
  }
</script>
</body>
</html>
