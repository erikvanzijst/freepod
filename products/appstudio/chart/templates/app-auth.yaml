{{- /*
"Sign in with Freepod" for the owner and the people they list (contract:
app-auth-chart-contract; access: app-studio-access). Both Ingresses, studio and
preview, carry these two middlewares ahead of their own; the custom chart's
templates/app-auth.yaml explains the Traefik behaviors they rely on.

`auth.enabled` and `auth.access: listed` must be system values of the template,
because the broker reads them there to decide who may sign in at all. `l=1` has
the verifier apply the deployment's access list on every request, which always
admits the owner; `n` names the app on the page anyone else is refused with.
*/}}
{{- if not (and (kindIs "bool" .Values.auth.enabled) .Values.auth.enabled (eq (.Values.auth.protocol | default "header") "header") (eq .Values.auth.access "listed")) }}
{{- fail "appstudio: auth.enabled must be true with auth.access listed and header authentication, as system values of the template; the studio is never served to anyone but its owner and the people they list" }}
{{- end }}
{{- if .Values.caelus.ingress.enabled }}
{{- $verifyUrl := required "appstudio: caelus.appAuth.verifyUrl is missing; the reconciler injects it, and the studio is never served without it" .Values.caelus.appAuth.verifyUrl }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-strip-identity
  labels:
    {{- include "appstudio.labels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      {{- range (include "appstudio.identityHeaders" . | fromJsonArray) }}
      {{ . }}: ""
      {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-app-auth
  labels:
    {{- include "appstudio.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ printf "%s?l=1&n=%s" $verifyUrl (urlquery "App Studio") | quote }}
    authResponseHeaders:
      - Cookie
      {{- range (include "appstudio.identityHeaders" . | fromJsonArray) }}
      - {{ . }}
      {{- end }}
{{- end }}
