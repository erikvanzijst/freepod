{{- if .Values.caelus.ingress.enabled }}
{{- $tlsCustom := not .Values.caelus.ingress.tls.wildcard }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-open-project
  labels:
    {{- include "appstudio.labels" . | nindent 4 }}
spec:
  {{- /* The page adds the project to the browser's list, then opens a session in it. */}}
  redirectRegex:
    regex: "^(https?://[^/]+)/$"
    replacement: "${1}/.appstudio/start.html#{{ .Values.projectDir }}"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    {{- include "appstudio.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ include "appstudio.routerMiddlewares" (dict "root" . "extra" (list "open-project")) | quote }}
    {{- if $tlsCustom }}
    cert-manager.io/cluster-issuer: {{ .Values.caelus.ingress.tls.issuer | quote }}
    {{- end }}
spec:
  ingressClassName: traefik
  {{- if $tlsCustom }}
  tls:
    - hosts:
        - {{ .Values.caelus.ingress.host | quote }}
      secretName: {{ .Values.caelus.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.caelus.ingress.host | quote }}
      http:
        paths:
          - path: /.appstudio
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-app
                port:
                  name: start
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-app
                port:
                  number: {{ .Values.service.port }}
{{- end }}
