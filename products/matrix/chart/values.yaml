serverName: "matrix.example.com"

image:
  repository: ghcr.io/matrix-construct/tuwunel
  tag: "v1.5.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 6167

ingress:
  enabled: true
  className: traefik
  annotations: {}

persistence:
  enabled: true
  existingClaim: ""
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClassName: null

registration:
  token: ""
  tokenSecretRef:
    name: ""
    key: registration-token

federation:
  enabled: true

trustedServers:
  - matrix.org

tuwunel:
  maxRequestSize: 20000000
  queryOverTcpOnly: false
  log: info

# Element Web, served at the hostname's root (everything outside /_matrix,
# /_tuwunel and /.well-known/matrix) and locked to this homeserver.
elementWeb:
  enabled: true
  image:
    repository: ghcr.io/element-hq/element-web
    tag: "v1.12.28"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 250m
      memory: 128Mi

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    cpu: "2"
    memory: 2Gi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables for advanced tuning.
# Each entry needs `name` and either `value` or `valueFrom`.
extraEnv: []

# TLS is injected per-deployment by the Caelus reconciler (caelus.ingress.tls). This
# default lets the chart render standalone (helm template / tests) with TLS off.
caelus:
  ingress:
    enabled: false
    tls: {}
  vars: {}
