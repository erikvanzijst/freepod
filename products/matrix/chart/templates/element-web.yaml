{{- /*
Element Web, served from the homeserver's own hostname so that opening the
deployment lands on a client instead of Tuwunel's blank root. The config pins
the client to this homeserver and hides the server picker.

The pod carries its own app.kubernetes.io/name so the Tuwunel Service, which
selects on the chart's name, never routes to it.
*/}}
{{- define "matrix.elementWeb.config" -}}
{
  "default_server_config": {
    "m.homeserver": {
      "base_url": {{ printf "https://%s" .Values.serverName | toJson }},
      "server_name": {{ .Values.serverName | toJson }}
    }
  },
  "disable_custom_urls": true,
  "disable_guests": true,
  "disable_3pid_login": true,
  "embedded_pages": { "login_for_welcome": true },
  "room_directory": { "servers": [{{ .Values.serverName | toJson }}] },
  "integrations_ui_url": null,
  "integrations_rest_url": null,
  "integrations_widgets_urls": null,
  "bug_report_endpoint_url": null,
  "mobile_guide_toast": true,
  "element_call": { "disable": true },
  "setting_defaults": { "UIFeature.voip": false }
}
{{- end -}}

{{- /* Runs from the image's /docker-entrypoint.d before nginx starts. Static
pages see little traffic, so one worker instead of one per node CPU. */}}
{{- define "matrix.elementWeb.singleWorker" -}}
#!/bin/sh
sed -i 's/^worker_processes .*/worker_processes 1;/' /etc/nginx/nginx.conf
{{- end -}}

{{- if .Values.elementWeb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "matrix.elementWeb.fullname" . }}
  labels:
    {{- include "matrix.elementWeb.labels" . | nindent 4 }}
data:
  config.json: |
    {{- include "matrix.elementWeb.config" . | nindent 4 }}
  single-worker.sh: |
    {{- include "matrix.elementWeb.singleWorker" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "matrix.elementWeb.fullname" . }}
  labels:
    {{- include "matrix.elementWeb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "matrix.elementWeb.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matrix.elementWeb.fullname" . }}
  labels:
    {{- include "matrix.elementWeb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "matrix.elementWeb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "matrix.elementWeb.selectorLabels" . | nindent 8 }}
      annotations:
        # Both files are read once at startup; roll the pod when either changes.
        checksum/config: {{ print (include "matrix.elementWeb.config" .) (include "matrix.elementWeb.singleWorker" .) | sha256sum }}
    spec:
      containers:
        - name: element-web
          image: "{{ .Values.elementWeb.image.repository }}:{{ .Values.elementWeb.image.tag }}"
          imagePullPolicy: {{ .Values.elementWeb.image.pullPolicy }}
          env:
            # The image defaults to port 80, which its non-root nginx user cannot bind under Kubernetes.
            - name: ELEMENT_WEB_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.elementWeb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: config
              mountPath: /docker-entrypoint.d/25-single-worker.sh
              subPath: single-worker.sh
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "matrix.elementWeb.fullname" . }}
            defaultMode: 0555
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
{{- end }}
