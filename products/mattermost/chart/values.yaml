# Default values for mattermost self-contained Helm chart
# This chart bundles PostgreSQL with Mattermost Team Edition

host: ""

smtp:
  host: ""
  port: "25"
  from: "caelus@deprutser.be"

mattermost:
  image:
    repository: mattermost/mattermost-team-edition
    tag: "11.4.2"
    imagePullPolicy: IfNotPresent
  # siteName -- Overrides Mattermost's "Site Name" (default: "Mattermost")
  # siteDescription -- Text shown above the login form
  ingress:
    className: "traefik"
    path: /
  extraEnv:
    # https://docs.mattermost.com/administration-guide/configure/environment-configuration-settings.html
    # https://docs.mattermost.com/administration-guide/configure/site-configuration-settings.html
    TZ: Europe/Amsterdam
    MM_CALLS_GROUP_CALLS_ALLOWED: "true"
    MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"

# PostgreSQL configuration
postgresql:
  image: postgres
  imageTag: "18"
  username: postgres
  password: postgres
  database: postgres
  size: 10Gi

# TLS is injected per-deployment by the Caelus reconciler (caelus.ingress.tls). This
# default lets the chart render standalone (helm template / tests) with TLS off.
caelus:
  ingress:
    enabled: false
    tls: {}

sshSidecarImage: ghcr.io/erikvanzijst/freepod/ssh-sidecar:0.5.2
