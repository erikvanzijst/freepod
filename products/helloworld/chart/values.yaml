image:
  repository: nginx
  tag: "1.27"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: ""

storage:
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""

user:
  message: "Hello from Caelus"

# Requests only, no limits: a floor that makes the pod Burstable rather than
# BestEffort.
resources:
  requests:
    cpu: 5m
    memory: 16Mi

# Plan- and TLS-related values are injected per-deployment by the Caelus reconciler
# (caelus.plan.*, caelus.ingress.tls). These defaults let the chart render standalone
# (helm template / lint / tests): plan is empty so the PVC falls back to storage.size,
# and TLS is off.
caelus:
  plan: {}
  ingress:
    enabled: false
    tls: {}

sshSidecarImage: ghcr.io/erikvanzijst/freepod/ssh-sidecar:0.5.2
