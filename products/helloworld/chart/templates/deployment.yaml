apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello-static.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "hello-static.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hello-static.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hello-static.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: write-index
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              cat > /data/index.html <<'HTML'
              <html><body>{{ .Values.user.message }}</body></html>
              HTML
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        # The SSH sidecar, rooted at a read-only mount of the data PVC, which
        # the session sees as /data. Never mount a DB or state volume here.
        {{- include "ssh-sidecar.sidecar" (dict "root" . "image" .Values.sshSidecarImage
             "sessionRoot" "volume:/data"
             "mounts" (list (dict "volume" "data" "path" "/data"))) | nindent 8 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "hello-static.fullname" . }}-data
