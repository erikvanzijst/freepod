apiVersion: v2
name: immich
description: >-
  Self-contained Freepod chart for Immich. Renders the full deployment (server,
  machine-learning, valkey, postgres) directly.
type: application
version: 0.2.3
appVersion: "v2.7.0"
keywords:
  - immich
  - photos
  - media
  - postgres
  - valkey
maintainers:
  - name: Caelus Team

# Only dependency is Freepod's own SFTP library chart (renders no resources on
# its own; provides the sidecar + Pipe/Service/Secret helpers).
dependencies:
  - name: ssh-sidecar
    version: "0.5.0"
    repository: "file://../../_lib/ssh-sidecar-chart"
