{{- /*
Immich machine-learning (CLIP/face recognition). Stateless apart from a model
cache on an emptyDir; the server reaches it at IMMICH_MACHINE_LEARNING_URL.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-machine-learning
  labels:
    {{- include "immich.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "immich.componentSelector" (dict "root" . "name" "machine-learning") | nindent 4 }}
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-machine-learning
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    {{- include "immich.componentSelector" (dict "root" . "name" "machine-learning") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "immich.componentSelector" (dict "root" . "name" "machine-learning") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "immich.componentSelector" (dict "root" . "name" "machine-learning") | nindent 8 }}
    spec:
      containers:
        - name: main
          image: {{ .Values.image.machineLearning.repository }}:{{ include "immich.appTag" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3003
              name: http
          env:
            # Keep every cache the ML image writes on the emptyDir, not the
            # (read-only) image layers.
            - name: TRANSFORMERS_CACHE
              value: /cache
            - name: HF_XET_CACHE
              value: /cache/huggingface-xet
            - name: MPLCONFIGDIR
              value: /cache/matplotlib-config
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 60
          volumeMounts:
            - name: cache
              mountPath: /cache
          {{- with .Values.machineLearning.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: cache
          emptyDir: {}
