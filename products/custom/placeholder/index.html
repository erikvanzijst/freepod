<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awaiting deployment</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fcfcfb;
    --fg: #1a1a18;
    --muted: #71716a;
    --rule: #e4e4de;
    --dot: #b8b8ae;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --fg: #edece7;
      --muted: #99988e;
      --rule: #2e2e2a;
      --dot: #5d5d55;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    max-width: 30rem;
    text-align: center;
  }

  .dot {
    width: 0.5rem;
    height: 0.5rem;
    margin: 0 auto 2rem;
    border-radius: 50%;
    background: var(--dot);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; opacity: 0.7; }
  }

  h1 {
    margin: 0 0 0.75rem;
    font-size: 1.375rem;
    font-weight: 600;
    letter-spacing: -0.012em;
  }

  p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9375rem;
    text-wrap: pretty;
  }

  footer {
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.8125rem;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>This application is awaiting deployment.</h1>
    <p>
      The address is reserved and routing correctly. As soon as an image is
      built and released, it will be served here.
    </p>
    <footer>Freepod</footer>
  </main>
  <script>
    // Once the first build is released, the Service routes this URL to it and
    // the response stops carrying the placeholder's header. Reload then, so a
    // visitor left on this page lands on the application without doing
    // anything. Gateway errors and network failures are the rollout in
    // progress (or a hiccup), not the application, so polling continues.
    (function () {
      var INTERVAL_MS = 2000;
      var timer = null;

      function schedule() {
        if (timer === null && !document.hidden) {
          timer = setTimeout(probe, INTERVAL_MS);
        }
      }

      function probe() {
        timer = null;
        if (document.hidden) return;
        fetch(location.href, { method: "HEAD", cache: "no-store", redirect: "manual" })
          .then(function (res) {
            // A redirect is opaque here, but the placeholder never redirects.
            var released = res.type === "opaqueredirect" ||
              (!res.headers.has("X-Freepod-Placeholder") && [502, 503, 504].indexOf(res.status) === -1);
            if (released) {
              location.reload();
            } else {
              schedule();
            }
          }, schedule);
      }

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          clearTimeout(timer);
          timer = null;
        } else {
          probe();
        }
      });

      schedule();
    })();
  </script>
</body>
</html>
