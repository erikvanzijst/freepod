server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Every path gets the same page. The application that will eventually own
    # these routes does not exist yet, so there is nothing to 404 against — and a
    # visitor who bookmarked a deep link should still see the explanation.
    location / {
        try_files /index.html =404;

        # The page polls its own URL and reloads once a response arrives
        # without this header: the first real build has been released.
        add_header X-Freepod-Placeholder 1 always;
        # Never cached, so that reload cannot come back to this page.
        add_header Cache-Control no-store always;
    }
}
