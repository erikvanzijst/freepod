# --- User-supplied values -----------------------------------------------------
# The only two values a tenant may set. They are the whole of the product
# template's values_schema_json (see README § User values schema); everything
# below is system- or reconciler-owned.

# Hostname the application is served on. The API finds this field by its
# `"title": "hostname"` in the values schema, claims it, and the reconciler
# injects it back as caelus.ingress.host — which is what the Ingress actually
# routes. This blank default only exists so the chart renders standalone.
hostname: ""

# The image to run, as "{user_id}@{digest}" — e.g.
# "5@sha256:4777d0…" with a 64 hex-char digest. This is a real image reference
# with the registry host stripped off: the repository is the owner's user id, so
# the pull reference is just this value prefixed with `registry` (below).
#
# Both omissions are deliberate. Withholding the registry host stops a tenant
# pointing at an arbitrary one, and the "{user_id}" repository is a claim that is
# asserted against caelus.owner.id at render time (templates/_helpers.tpl) rather
# than trusted — that assertion is what stops one tenant deploying another
# tenant's image.
#
# Empty is the normal state for a fresh deployment: `freepod init` creates it and
# claims the hostname before any build exists. The chart then runs
# placeholderImage, so the domain serves a real page instead of a Traefik 503.
image: ""

# --- System values ------------------------------------------------------------

# Registry holding user images. Prefixed onto `image` to form the pull
# reference: "{registry}/{user_id}@{digest}".
registry: registry.home

# Served whenever `image` is empty. Deliberately a system value with a default: a
# second user-settable image reference would bypass the ownership assertion
# entirely and hand tenants an arbitrary-image escape hatch. Built and published
# from products/custom/placeholder (see README).
placeholderImage: ghcr.io/erikvanzijst/freepod/custom-placeholder:0.1.0

# Digests are immutable, so there is nothing to re-pull; the placeholder is tag
# addressed but changes only when the platform republishes it.
pullPolicy: IfNotPresent

# The platform's SSH sidecar, which gives this deployment's owner a shell in
# their application container, the PostgreSQL toolbox, and a forward to their
# database.
sshSidecarImage: ghcr.io/erikvanzijst/freepod/ssh-sidecar:0.5.1

# Port the application is served on. Injected into the container as the `PORT`
# env var and targeted by the Service, so the contract with tenant images is
# "bind 0.0.0.0:$PORT" rather than a fixed number — that is Railway's convention,
# which the Railpack builder assumes, and it keeps this value a platform-side
# detail we can change without breaking existing builds.
#
# The placeholder image is the exception: it is ours, nginx will not read $PORT
# without templating, so it is pinned to this default and must be rebuilt if the
# default ever changes.
containerPort: 8080

service:
  port: 80

replicas: 1

# Empty by default; per-plan requests/limits belong here once real usage of
# tenant-built images is measured.
resources: {}

# Whether this chart wires up object storage — an S3 bucket, NOT a volume. Named
# `objectStorage` rather than `storage` to stay distinct from
# `caelus.plan.storageBytes`, which is block storage (a PVC size).
#
# A **system value**, like `registry` and `placeholderImage` above: it is set by
# the product's catalog entry and is deliberately absent from the tenant-facing
# values schema, so a tenant can neither enable nor disable it.
#
# It sits here rather than under `caelus` because that namespace is for values
# the reconciler injects *per deployment*. This one is a static product
# declaration — identical for every deployment of the product — and it is a real
# input this chart reads, so it belongs in the chart's own schema.
objectStorage:
  enabled: false

# Whether this chart wires up a PostgreSQL database. A system value like
# `objectStorage` above, set by the product's catalog entry and absent from the
# tenant-facing schema, so a tenant can neither enable nor disable it.
relationalStorage:
  enabled: false

# Injected per deployment by the Caelus reconciler. These defaults let the chart
# render standalone (helm lint / helm template with no --set).
caelus:
  # Identifier of the rollout being applied, rendered onto the pod template as
  # the `caelus.dev/release-id` label so a log line can be attributed to one
  # release. The reconciler supplies it on every apply, for every product;
  # rendering it is each chart's decision and only this one does. Empty by
  # default so the chart renders standalone, in which case no label is emitted
  # and collection behaves exactly as it did before.
  releaseId: ""
  # The same release as `freepod releases` shows it. Not rendered by this chart
  # itself: the `ssh-sidecar` dev profile hands it to the sidecar, whose session
  # banner reports it, because a banner naming the uuid above answers "which
  # release did I land on" in a spelling the user cannot look up. A string, so
  # that the standalone default is distinguishable from release 0 -- the sidecar
  # refuses to start on an empty one.
  releaseNumber: ""
  # owner.id is required whenever `image` is set. With the default empty image the
  # chart renders the placeholder and never reads it, which is what keeps a
  # standalone render working.
  owner: {}
  ingress:
    enabled: false
    tls: {}
  # Per-deployment object storage references, injected by the reconciler once it
  # has provisioned the bucket. The *toggle* is the top-level `objectStorage`
  # above — a static product declaration; these are the per-deployment runtime
  # facts, which is why they live in the reconciler-owned namespace.
  #
  # `secretName` names a Secret the reconciler writes into the deployment's
  # namespace before Helm runs. The credentials themselves are deliberately not
  # here — Helm values are logged and persisted, so they are the wrong carrier
  # for a credential.
  #
  # Empty by default so the traversal in deployment.yaml resolves and `required`
  # can report the missing value, rather than failing on a nil map.
  objectStorage: {}
  # Per-deployment database references, injected once the reconciler has
  # provisioned the database. The host and port are the pooler's: a tenant pod
  # cannot reach the PostgreSQL server directly. The password is deliberately
  # not here, for the same reason the S3 credential is not.
  database: {}
  # Runtime configuration the tenant set, injected as the *name* of a Secret the
  # reconciler writes into the deployment's namespace before Helm runs. The
  # values are deliberately not here: Helm values are logged in full and
  # persisted into a tenant-namespace object, so they are the wrong carrier for
  # anything a tenant marked sensitive.
  #
  # Empty by default, and absent entirely when the release carries no vars, in
  # which case no `envFrom` source is rendered at all rather than an empty one.
  vars: {}
