{{- /*
The application pod. Runs the tenant's own image, or the platform placeholder
while no build exists yet — see "custom.imageRef" in _helpers.tpl, which also
enforces that the image belongs to this deployment's owner.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    {{- include "custom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- /*
  How long a new pod must stay Ready before it counts as available, and
  therefore before `helm upgrade --wait` will call the rollout done. The
  readiness probe below decides when it is Ready; this floor additionally
  catches an application that answers once and then crashes.
  */}}
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "custom.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "custom.selectorLabels" . | nindent 8 }}
        {{- /* Pod template only. Never spec.selector.matchLabels above
               (immutable) and never the Service's selector -- see
               "custom.podLabels" in _helpers.tpl. */}}
        {{- include "custom.podLabels" . | nindent 8 }}
    spec:
      {{- /*
      TODO: this needs to be in the reconciler -- not per-chart.
      */}}
      automountServiceAccountToken: false
      {{- /*
      What makes the `dev` access profile work.
      */}}
      shareProcessNamespace: true
      {{- /*
      The node pulls a tenant image with the owner's credential, which the
      reconciler publishes before Helm runs. The placeholder needs none.
      */}}
      {{- if trim (default "" .Values.image) }}
      imagePullSecrets:
        - name: {{ required "custom: caelus.registry.pullSecret is missing; the Caelus reconciler publishes it for every deployment" .Values.caelus.registry.pullSecret | quote }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "custom.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- /*
          The platform's health check, documented to tenants as "GET / answers
          2xx or 3xx". It gates traffic, so a new release takes requests only
          once it serves them, and the rollout, so one that never does is rolled
          back. No liveness probe: restarting an app that is slow on / would be
          worse than leaving it out of rotation.
          */}}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            # The platform tells the app which port to bind, rather than the app
            # being required to know. This is Railway's convention, which the
            # Railpack builder assumes, and it is what makes zero-config builds
            # work: apps idiomatically do `process.env.PORT || 3000`. Deriving it
            # from the same value the Service targets keeps the number a
            # platform-side detail we can change unilaterally.
            - name: PORT
              value: {{ .Values.containerPort | quote }}
          {{- /*
          Order is load-bearing. A later `envFrom` source overrides an earlier
          one, and an explicit `env` entry beats every `envFrom`, so the
          tenant's own vars go FIRST and everything the platform provides comes
          after them: a var named like an injected credential cannot displace
          it, and `PORT` above is safe by being explicit. The API also rejects
          those names outright, but the two protections fail differently and
          neither is load-bearing on its own — a tenant shadowing their own
          pod's variables harms only their own pod, it is just confusing and
          hard to diagnose.

          Object storage second. The Secret carries the conventional AWS_*
          names, so a tenant's `boto3.client("s3")` works with no configuration
          at all. The database Secret follows, carrying DATABASE_URL and the
          discrete PG* variables for the same reason.

          Two namespaces on purpose. `objectStorage.enabled` is the product's
          own static declaration — a system value from the catalog, the same for
          every deployment of this product. `caelus.objectStorage.*` are the
          per-deployment facts the reconciler injects after provisioning.
          */}}
          {{- if or .Values.caelus.vars.secretName .Values.objectStorage.enabled .Values.relationalStorage.enabled }}
          envFrom:
            {{- with .Values.caelus.vars.secretName }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
            {{- if .Values.objectStorage.enabled }}
            - secretRef:
                name: {{ required "custom: caelus.objectStorage.secretName is required when object storage is enabled" .Values.caelus.objectStorage.secretName | quote }}
            {{- end }}
            {{- if .Values.relationalStorage.enabled }}
            - secretRef:
                name: {{ required "custom: caelus.database.secretName is required when relational storage is enabled" .Values.caelus.database.secretName | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- /*
        The platform's SSH sidecar, rooted at the application container: a shell
        in the tenant's own filesystem, file transfer into it, the PostgreSQL
        toolbox and a forward to the deployment's database. It runs as root,
        which is what reading and entering another container's process
        filesystem requires; the application container above gains nothing.
        */}}
        {{- include "ssh-sidecar.sidecar" (dict "root" . "image" .Values.sshSidecarImage
             "sessionRoot" "app-container") | nindent 8 }}
