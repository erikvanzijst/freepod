# Bespoke Nextcloud chart values.

# Public hostname. Used as the ingress rule host, NEXTCLOUD_TRUSTED_DOMAINS, and
# the Host header on the health probes.
host: "nextcloud.local"

trustedProxies:
  - "10.42.0.0/16"

image:
  repository: docker.io/library/nextcloud
  # Tag defaults to the chart appVersion (an -apache variant is appended).
  tag: ""
  pullPolicy: IfNotPresent

# Admin bootstrap account (only consumed on first init).
admin:
  username: admin
  password: changeme

# Wrapper ingress. TLS injected per-deployment by the Caelus reconciler.
ingress:
  enabled: true
  className: traefik
  annotations: {}

# Cluster-internal SMTP relay. Leave host empty to disable mail.
smtp:
  host: "smtp.mailer.svc.cluster.local"
  port: 25
  fromAddress: "nextcloud@freepod.eu"
  domain: "freepod.eu"
  secure: ""
  authtype: ""
  username: ""
  password: ""

# Nextcloud data PVC (files + config + apps). caelus.plan.storageSize overrides.
storage:
  data:
    accessMode: ReadWriteOnce
    size: 100Gi
    storageClassName: ""

# Bundled PostgreSQL: a lean StatefulSet on the official postgres image (see
# templates/postgres.yaml).
postgresql:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: nextcloud
    # Empty = auto-generate a strong password on first install and reuse it from
    # the <release>-db Secret on upgrade (see nextcloud.postgresPassword). Set a
    # literal value only to pin an explicit password.
    password: ""
    database: nextcloud
  persistence:
    accessMode: ReadWriteOnce
    size: 8Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 15m
      memory: 128Mi

resources:
  requests:
    cpu: 15m
    memory: 256Mi

# Plan- and TLS-related values are injected per-deployment by the Caelus reconciler
# (caelus.plan.*, caelus.ingress.tls). These defaults let the chart render standalone
# (helm template / lint / tests): plan is empty so the PVC falls back to storage sizes.
caelus:
  plan: {}
  ingress:
    enabled: false
    tls: {}

sshSidecarImage: ghcr.io/erikvanzijst/freepod/ssh-sidecar:0.5.2
