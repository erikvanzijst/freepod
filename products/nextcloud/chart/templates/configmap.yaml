apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: {{ .Release.Name }}-postgresql
  OVERWRITEPROTOCOL: "https"
  NEXTCLOUD_TRUSTED_DOMAINS: {{ .Values.host | quote }}
  NEXTCLOUD_DATA_DIR: /var/www/html/data
  {{- if .Values.trustedProxies }}
  TRUSTED_PROXIES: {{ join " " .Values.trustedProxies | quote }}
  {{- end }}
  {{- if .Values.smtp.host }}
  MAIL_FROM_ADDRESS: {{ .Values.smtp.fromAddress | quote }}
  MAIL_DOMAIN: {{ .Values.smtp.domain | quote }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  SMTP_SECURE: {{ .Values.smtp.secure | quote }}
  SMTP_AUTHTYPE: {{ .Values.smtp.authtype | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-hooks
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
data:
  db-maintenance.sh: |
    #!/bin/sh
    # Runs from /docker-entrypoint-hooks.d/before-starting on every boot, after
    # the entrypoint's `occ upgrade`. DB migrations are therefore already applied
    # and the schema version matches the code, which is exactly the state these
    # commands require.
    #
    # All steps are idempotent no-ops once applied, so re-running each boot is
    # cheap and also catches changes that later-installed apps introduce without
    # a core upgrade. Best-effort (no `set -e`): a failed step must not keep the
    # instance from starting.
    #
    # The db:* and maintenance:repair steps are what Nextcloud deliberately
    # defers out of the automatic upgrade (because it can be slow on big
    # instances) and then nags the admin to run by hand -- work that is trivial
    # at Freepod's scale.
    #
    # add-missing-*: clears the "missing indices/columns/primary keys" warning.
    php /var/www/html/occ db:add-missing-indices
    php /var/www/html/occ db:add-missing-columns
    php /var/www/html/occ db:add-missing-primary-keys
    # --include-expensive: runs the deferred repair steps, notably the mimetype
    # migration ("mimetype migrations available" warning).
    php /var/www/html/occ maintenance:repair --include-expensive
    # Reconcile the persisted trusted_domains with the chart's host. This is NOT
    # redundant with NEXTCLOUD_TRUSTED_DOMAINS: the image applies that variable
    # only in its initial-install branch, and ignores it on every later boot
    # because config.php already exists on the data PVC. So after a hostname
    # change the OLD host stays persisted, Nextcloud answers 400 to any request
    # whose Host header is not trusted, and the pod fails the /status.php
    # startup probe -- 30 x 10s, which is exactly the platform's Helm timeout,
    # so `helm upgrade --atomic` rolls the release back and silently reverts the
    # ingress to the old hostname while the database keeps the new one. It
    # presents as a Helm timeout and is not one.
    #
    # Index assignment mirrors the entrypoint's own install-time loop: index 0
    # is the installer's `localhost`, and the chart's hosts own index 1 upward,
    # so this rewrites only slots the platform already owns.
    idx=1
    for domain in $NEXTCLOUD_TRUSTED_DOMAINS; do
        php /var/www/html/occ config:system:set trusted_domains "$idx" --value="$domain"
        idx=$((idx + 1))
    done
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-apache
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
data:
  hsts.conf: |
    # TLS terminates at the edge (Traefik), which owns the browser-facing HSTS
    # header. But Nextcloud's server-side "HTTP headers" setup check inspects a
    # loopback request that reaches Apache directly, bypassing that middleware,
    # so it reports HSTS as missing. Emit it here too to satisfy the check;
    # Traefik still overwrites it with the authoritative value on external
    # responses, so browsers never see a duplicate.
    <IfModule mod_headers.c>
      Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"
    </IfModule>
