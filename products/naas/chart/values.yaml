image:
  repository: python
  tag: "3.12-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: ""

server:
  port: 8080

# Requests only, no limits: a floor that makes the pod Burstable rather than
# BestEffort.
resources:
  requests:
    cpu: 5m
    memory: 32Mi

# TLS is injected per-deployment by the Caelus reconciler (caelus.ingress.tls). This
# default lets the chart render standalone (helm template / tests) with TLS off.
caelus:
  ingress:
    enabled: false
    tls: {}
